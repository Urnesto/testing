# fly.toml — deploy rrr-scraper API to Fly.io
# fly launch --config rrr-scraper/fly.toml

app = "rrr-scraper"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[mounts]
  source = "rrr_scraper_output"
  destination = "/app/output"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
